# Pings Supabase every 3 days so the free project never pauses for inactivity.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 1 */3 * *'   # 01:00 UTC (09:00 Malaysia) every 3rd day
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'

  stay-enabled:
    # GitHub turns off scheduled workflows after 60 days without repo activity; re-enabling resets that.
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
