<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pet Fund</title>
  <meta name="theme-color" content="#c2632e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="screen-center" hidden>
    <div class="login-card">
      <img src="icon.svg" alt="" width="72" height="72">
      <h1>Pet Fund</h1>
      <p class="muted">Murphy · Panda · Watson · Mochi · Poppy</p>
      <button id="google-btn" class="btn btn-primary btn-block">Sign in with Google</button>
      <p id="login-msg" class="muted small"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <span class="brand">🐾 Pet Fund</span>
      <span id="who" class="muted small"></span>
    </header>
    <main id="view"></main>
    <nav class="tabbar" aria-label="Main">
      <a href="#/home" data-route="home"><span aria-hidden="true">🏠</span>Home</a>
      <a href="#/history" data-route="history"><span aria-hidden="true">📜</span>History</a>
      <a href="#/add" data-route="add" class="tab-add" aria-label="Add entry"><span aria-hidden="true">＋</span></a>
      <a href="#/reports" data-route="reports"><span aria-hidden="true">📊</span>Reports</a>
      <a href="#/more" data-route="more"><span aria-hidden="true">☰</span>More</a>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
